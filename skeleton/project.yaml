# Манифест проекта. Источник истины для скриптов workspace/bin и для таблицы сервисов в AGENTS.md.
name: {{PROJECT}}
lang: ru
task_prefix: {{TASK_PREFIX}}        # префикс id задач: {{TASK_PREFIX}}-0001; в remote-режиме = очередь трекера, id = ключ
local_prefix: LOC                   # remote-режим: префикс задач, которых в трекере нет (LOC-0001)

tracker:
  mode: local                        # local — только файлы; remote — файлы + удалённый трекер (поле remote: в задачах)
  remote_transport: ""               # напр. mcp:ai-toolkit — как публиковать (описание в tracker/AGENTS.md)

repos:                               # порядок = порядок в таблице AGENTS.md и в скриптах
  - path: backend
    role: API и бизнес-логика
    stack: ""
    base_branch: main
    commit_scope: "{{TASK_PREFIX}}-NNN"
    status: active                   # active | wip | stub | deprecated
  - path: frontend
    role: веб-приложение
    stack: ""
    base_branch: main
    status: active
  - path: infra
    role: локальный стек и деплой
    stack: docker compose, make
    base_branch: main
    status: active

run:
  team: "cd infra && make up"        # командный способ; мой (если отличается) — в AGENTS.md и <сервис>/CLAUDE.local.md
  healthcheck: "cd infra && make smoke"

ports:
  app: 8080
  api: 8080

toolkit:                             # внешние наборы скиллов, копируемые в .claude/skills (bin/agent/toolkit-sync.sh)
  sources: []                        # напр. ["ai-toolkit/skills"]
