# Данные для скриптов workspace/bin (lib/common.sh читает их отсюда) и профиль, по которому init.sh развернул слой.
# Агент сюда не ходит: значения уже подставлены в инструкции; менять при смене репо, команд или префикса.
name: {{PROJECT}}
lang: ru
task_prefix: {{TASK_PREFIX}}        # префикс id задач: {{TASK_PREFIX}}-0001; с удалённым трекером — его очередь, id задачи = ключ

profile:                            # ответы init.sh; поменял — запусти agent-workspace-template/init.sh ещё раз (доложит файлы)
  kind: {{KIND}}                    # services — несколько репо; monorepo — один репо с модулями; app — одно приложение
  team: {{TEAM}}                    # solo — решения и план здесь; team — трекер и доки команды первичны, здесь копии
  tracker: {{TRACKER}}              # local — задачи только в файлах; remote — удалённый трекер, здесь зеркало
  commit: {{COMMIT}}                # auto — коммит по завершении задачи сразу; ask — спросить (ревью человека)
  adr: {{ADR}}                      # ADR и обсуждения переработок в личном слое
  estimates: {{ESTIMATES}}          # /estimate и поле estimation
  toolkit: {{TOOLKIT}}              # внешние наборы скиллов (bin/agent/toolkit-sync.sh)
{{#if tracker=remote}}
local_prefix: {{LOCAL_PREFIX}}      # задачи, которых в трекере нет: {{LOCAL_PREFIX}}-0001
tracker:
  remote_transport: ""              # напр. mcp:tracker — чем публиковать и подтягивать (описание — workspace/tracker/AGENTS.md)
{{/if}}

repos:                              # порядок = порядок в карте проекта AGENTS.md и в скриптах
{{#if kind=services}}
  - path: backend
    role: API и бизнес-логика
    stack: ""
    base_branch: main
    commit_scope: "{{TASK_PREFIX}}-NNN"
    status: active                  # active | wip | stub | deprecated
    commands:                       # команды качества, как их запускает команда (из корня репо); нет команды — нет ключа
      test: "make test"             # workspace/bin/stack/cmd.sh <name> [repo] запускает их; healthcheck.sh гоняет smoke по всем репо
      lint: "make lint"
  - path: frontend
    role: веб-приложение
    stack: ""
    base_branch: main
    status: active
    commands:
      test: "make test"
      lint: "make lint"
  - path: infra
    role: локальный стек и деплой
    stack: docker compose, make
    base_branch: main
    status: active
    commands:
      smoke: "make smoke"

run:
  team: "cd infra && make up"       # командный способ поднять всё; мой — <сервис>/CLAUDE.local.md
  healthcheck: ""                   # общая проверка стека сверх repos[].commands.smoke (напр. curl адресов)

ports:
  app: 8080
  api: 8080
{{#else}}
  - path: {{REPO}}                  # репозиторий кода; локальный git или клон
    role: ""
    stack: ""
    base_branch: main
    commit_scope: "{{TASK_PREFIX}}-NNNN"
    status: active                  # active | wip | stub | deprecated
    commands:                       # команды качества из корня репо (workspace/bin/stack/cmd.sh <name>); нет команды — нет ключа
      test: ""
      lint: ""
{{/if}}
{{#if toolkit}}

toolkit:                            # внешние наборы скиллов, копируемые в .claude/skills (bin/agent/toolkit-sync.sh)
  sources: []
{{/if}}
