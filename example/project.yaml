# Данные для скриптов workspace/bin и профиль, по которому init.sh развернул слой. Агент сюда не ходит.
name: bookly
lang: ru
task_prefix: BOOK                     # = очередь трекера: id задачи = ключ BOOK-431

profile:
  kind: services
  team: team
  tracker: remote
  commit: ask
  adr: no
local_prefix: BKL                     # задачи без тикета: BKL-0001
tracker:
  remote_transport: mcp:tracker        # публикация описания (trk.sh publish --json) и подтягивание через MCP-сервер tracker

repos:
  - path: backend
    role: REST API, домен, воркеры очередей
    stack: Symfony 7.1, PHP 8.3, PostgreSQL 16, Redis, RabbitMQ
    base_branch: main
    commit_scope: "feat(BOOK-NNN)"
    status: active
    commands:
      test: "make test"
      lint: "make lint"
  - path: frontend
    role: веб-приложение гостя и хоста
    stack: React 19, Vite, TypeScript, Tailwind
    base_branch: main
    commit_scope: "feat(BOOK-NNN)"
    status: active
    commands:
      test: "make test"
      lint: "make lint"
      smoke: "make e2e"
  - path: realtime
    role: WebSocket-уведомления
    stack: Node 22, ws, Redis pub/sub
    base_branch: main
    commit_scope: "feat(BOOK-NNN)"
    status: wip
    commands:
      test: "make test"
  - path: infra
    role: локальный стек и деплой
    stack: docker compose, make, nginx
    base_branch: main
    status: active
    commands:
      smoke: "make smoke"

run:
  team: "cd infra && make up"

ports:
  app: 8080
  api: 8080
  postgres: 5432
  rabbitmq_ui: 15672
